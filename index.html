<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evil Egg</title>

    <link rel="stylesheet" href="./theme/love.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: white;
            background: #000;
            font: 16px sans-serif;
            z-index: 100;
        }

        #message-container {
            display: none;
        }
    </style>
</head>

<body>

<div id="status">Loading Evil Egg...</div>

<div id="message-container"></div>

<canvas id="canvas" tabindex="0"></canvas>

<script>

function setFocus() {
    const canvas = document.getElementById("canvas");

    if (canvas) {
        canvas.focus();
    }
}


function drawLoadingStatus(text, soFar, total) {
    const status = document.getElementById("status");

    if (!status) return;

    if (total && soFar !== undefined) {
        const percent = Math.round((soFar / total) * 100);

        status.textContent =
            text + " " + percent + "%";
    } else {
        status.textContent =
            text || "Loading Evil Egg...";
    }
}


function onException(error) {
    console.error("LÖVE exception:", error);

    const status = document.getElementById("status");

    if (status) {
        status.textContent =
            "Game error: " +
            (error && error.message
                ? error.message
                : error);
    }
}


(async function () {

    const status = document.getElementById("status");

    try {

        await navigator.serviceWorker.register("./sw.js", {
            scope: "./"
        });

        await navigator.serviceWorker.ready;


        if (!navigator.serviceWorker.controller) {

            if (!sessionStorage.getItem("evilEggSWReloaded")) {

                sessionStorage.setItem(
                    "evilEggSWReloaded",
                    "1"
                );

                location.reload();

                return;
            }

            throw new Error(
                "Service worker failed to take control."
            );
        }


        sessionStorage.removeItem(
            "evilEggSWReloaded"
        );


        function loadScript(src) {

            return new Promise(function (
                resolve,
                reject
            ) {

                const script =
                    document.createElement("script");

                script.src = src;

                script.onload = resolve;

                script.onerror = function () {
                    reject(
                        new Error(
                            "Could not load " + src
                        )
                    );
                };

                document.body.appendChild(script);
            });
        }


        await loadScript("./love.js");

        await loadScript("./game.js");


    } catch (error) {

        console.error(
            "Evil Egg failed to start:",
            error
        );

        status.textContent =
            "Evil Egg failed to load: " +
            error.message;

        status.style.color = "#ff5555";
    }

})();

</script>

</body>
</html>
