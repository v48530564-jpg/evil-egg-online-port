<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evil Egg</title>

    <link rel="stylesheet" href="theme/love.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: white;
            background: #000;
            font: 16px sans-serif;
            z-index: 10;
            pointer-events: none;
        }

        #message-container {
            display: none;
        }
    </style>
</head>

<body>

    <div id="status">Loading Evil Egg...</div>

    <div id="message-container"></div>

    <canvas id="canvas" tabindex="0"></canvas>

    <script>
    (async () => {
        try {
            // Register the service worker so game.data can be assembled
            // from game.part1, game.part2 and game.part3.
            await navigator.serviceWorker.register("./sw.js", {
                scope: "./"
            });

            await navigator.serviceWorker.ready;

            // The service worker needs to control the page before love.js
            // attempts to download game.data.
            if (!navigator.serviceWorker.controller) {
                location.reload();
                return;
            }

            const loadScript = (src) => new Promise((resolve, reject) => {
                const script = document.createElement("script");

                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(
                    new Error("Failed to load " + src)
                );

                document.body.appendChild(script);
            });

            await loadScript("./love.js");
            await loadScript("./game.js");

        } catch (error) {
            console.error(error);

            const status = document.getElementById("status");

            if (status) {
                status.textContent = "Load failed: " + error.message;
                status.style.pointerEvents = "auto";
            }
        }
    })();
    </script>

</body>
</html>
