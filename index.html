<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evil Egg</title>

    <link rel="stylesheet" href="./theme/love.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: white;
            background: #000;
            font: 16px sans-serif;
            z-index: 100;
        }

        #message-container {
            display: none;
        }
    </style>
</head>

<body>

    <div id="status">Loading Evil Egg...</div>

    <div id="message-container"></div>

    <canvas id="canvas" tabindex="0"></canvas>

    <script>
    (async function () {
        const status = document.getElementById("status");

        try {
            /*
             * Register the service worker.
             * It combines game.part1 + game.part2 + game.part3
             * into the game.data request expected by LÖVE.
             */
            const registration =
                await navigator.serviceWorker.register("./sw.js", {
                    scope: "./"
                });

            await navigator.serviceWorker.ready;

            /*
             * On the very first visit, the newly-installed service
             * worker may not control this page yet.
             *
             * Reload exactly once so it becomes the controller.
             */
            if (!navigator.serviceWorker.controller) {
                if (!sessionStorage.getItem("evilEggSWReloaded")) {
                    sessionStorage.setItem("evilEggSWReloaded", "1");
                    location.reload();
                    return;
                }

                throw new Error(
                    "Service worker failed to take control of the page."
                );
            }

            sessionStorage.removeItem("evilEggSWReloaded");

            function loadScript(src) {
                return new Promise(function (resolve, reject) {
                    const script = document.createElement("script");

                    script.src = src;

                    script.onload = function () {
                        resolve();
                    };

                    script.onerror = function () {
                        reject(
                            new Error("Could not load " + src)
                        );
                    };

                    document.body.appendChild(script);
                });
            }

            /*
             * LÖVE runtime.
             */
            await loadScript("./love.js");

            /*
             * Generated Emscripten/LÖVE loader.
             */
            await loadScript("./game.js");

            /*
             * Give the runtime a moment to initialize, then remove
             * our HTML loading overlay.
             */
            setTimeout(function () {
                status.style.display = "none";

                const canvas = document.getElementById("canvas");
                if (canvas) {
                    canvas.focus();
                }
            }, 500);

        } catch (error) {
            console.error("Evil Egg failed to start:", error);

            status.textContent =
                "Evil Egg failed to load: " + error.message;

            status.style.color = "#ff5555";
        }
    })();
    </script>

</body>
</html>
