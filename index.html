<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evil Egg</title>

    <link rel="stylesheet" href="./theme/love.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: white;
            background: #000;
            font: 16px sans-serif;
            z-index: 100;
        }

        #message-container {
            display: none;
        }
    </style>
</head>

<body>

<div id="status">Loading Evil Egg...</div>

<div id="message-container"></div>

<canvas id="canvas" tabindex="0"></canvas>

<script>
function setFocus() {
    const canvas = document.getElementById("canvas");
    if (canvas) canvas.focus();
}

function drawLoadingStatus(text, soFar, total) {
    const status = document.getElementById("status");

    if (!status) return;

    status.textContent = text || "Loading Evil Egg...";
}

function onException(error) {
    console.error("LÖVE exception:", error);

    const status = document.getElementById("status");

    if (status) {
        status.textContent =
            "Game error: " +
            (error?.message || error);
    }
}

/*
 * IMPORTANT:
 * Module must exist BEFORE love.js/game.js are loaded.
 */
var Module = {
    arguments: ["/game.love"],

    canvas: document.getElementById("canvas"),

    printErr: function(text) {
        console.error("[LÖVE]", text);
    },

    setStatus: function(text) {
        drawLoadingStatus(text);
    },

    setFocus: setFocus,

    setExceptionMessage: onException,

    onRuntimeInitialized: function() {
        console.log("[Evil Egg] LÖVE runtime initialized.");

        window.addEventListener("focus", function() {
            if (typeof Module._love_setFocus === "function") {
                Module._love_setFocus(true);
            }
        });

        window.addEventListener("blur", function() {
            if (typeof Module._love_setFocus === "function") {
                Module._love_setFocus(false);
            }
        });
    }
};


/*
 * Register service worker FIRST.
 */
(async function() {

    try {

        await navigator.serviceWorker.register("./sw.js", {
            scope: "./"
        });

        await navigator.serviceWorker.ready;


        if (!navigator.serviceWorker.controller) {

            if (!sessionStorage.getItem("evilEggReload")) {

                sessionStorage.setItem(
                    "evilEggReload",
                    "1"
                );

                location.reload();

                return;
            }

            throw new Error(
                "Service worker is not controlling the page."
            );
        }

        sessionStorage.removeItem("evilEggReload");


        /*
         * Load love.js.
         */
        const loveScript =
            document.createElement("script");

        loveScript.src = "./love.js";

        loveScript.onload = function() {

            console.log(
                "[Evil Egg] love.js loaded."
            );


            /*
             * Then load game.js.
             */
            const gameScript =
                document.createElement("script");

            gameScript.src = "./game.js";

            gameScript.onload = function() {

                console.log(
                    "[Evil Egg] game.js loaded."
                );

            };

            gameScript.onerror = function() {

                throw new Error(
                    "Failed to load game.js"
                );

            };

            document.body.appendChild(
                gameScript
            );
        };


        loveScript.onerror = function() {

            throw new Error(
                "Failed to load love.js"
            );

        };


        document.body.appendChild(
            loveScript
        );


    } catch (error) {

        console.error(
            "[Evil Egg] Startup error:",
            error
        );

        document.getElementById(
            "status"
        ).textContent =
            "Startup failed: " +
            error.message;

    }

})();
</script>

</body>
</html>
