<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Evil Egg</title>
<link rel="stylesheet" href="./theme/love.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#canvas{display:block;width:100vw;height:100vh;outline:0}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#000;font:16px sans-serif;z-index:100;white-space:pre-wrap;text-align:center}
#message-container{display:none}
</style>
</head>
<body>
<div id="status">Loading Evil Egg...</div>
<div id="message-container"></div>
<canvas id="canvas" tabindex="0"></canvas>
<script>
function setFocus(){
  var c=document.getElementById("canvas");
  if(c) c.focus();
}
function drawLoadingStatus(text,soFar,total){
  var s=document.getElementById("status");
  if(!s) return;
  s.textContent=text||"Loading Evil Egg...";
}
function onException(error){
  console.error("[Evil Egg] LÖVE error:",error);
  var s=document.getElementById("status");
  if(s){
    s.style.display="grid";
    s.style.color="#ff6666";
    s.textContent="Evil Egg error:\n"+(error&&error.message?error.message:String(error));
  }
}
navigator.serviceWorker.register("./sw.js",{scope:"./"})
.then(function(){return navigator.serviceWorker.ready;})
.then(function(){
  if(!navigator.serviceWorker.controller){
    sessionStorage.setItem("evilEggSWReload","1");
    location.reload();
    return new Promise(function(){});
  }
  return new Promise(function(resolve,reject){
    var s=document.createElement("script");
    s.src="./love.js";
    s.onload=resolve;
    s.onerror=function(){reject(new Error("Failed to load love.js"));};
    document.body.appendChild(s);
  });
})
.then(function(){
  return new Promise(function(resolve,reject){
    var s=document.createElement("script");
    s.src="./game.js";
    s.onload=resolve;
    s.onerror=function(){reject(new Error("Failed to load game.js"));};
    document.body.appendChild(s);
  });
})
.catch(onException);
</script>
</body>
</html>
