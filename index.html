<!doctype html><html><head><meta charset="utf-8"><title>Evil Egg</title><link rel="stylesheet" href="theme/love.css"></head><body style="margin:0;background:#000"><div id="status" style="position:fixed;inset:0;display:grid;place-items:center;color:white;font:16px sans-serif">Loading Evil Egg...</div><script>
(async()=>{try{
 await navigator.serviceWorker.register("./sw.js",{scope:"./"}); await navigator.serviceWorker.ready;
 if(!navigator.serviceWorker.controller){location.reload();return}
 const load=x=>new Promise((ok,no)=>{let s=document.createElement("script");s.src=x;s.onload=ok;s.onerror=no;document.body.appendChild(s)});
 await load("./love.js"); await load("./game.js"); document.getElementById("status").remove();
}catch(e){console.error(e);document.getElementById("status").textContent="Load failed: "+e.message}})();
</script></body></html>
